# Captions of the subsystem, referenced from .lsf as {Key}.
#
# The artifact used to free-ride on the host bundle: the keys without a prefix
# also exist in MyCompanyResourceBundle, so a mycompany host resolved them and nothing
# looked wrong. Any other host rendered the raw {Key} instead - lsfusion-erp supplies
# only ID. {Name} titles almost every catalogue, so the whole subsystem read as
# untranslated.
#
# Those keys keep the mycompany names on purpose, so a mycompany host goes on
# resolving them from its own bundle. Their values started as a copy of that bundle and
# no longer are one: the Russian Name is the full word, and month_fl is a three-letter
# abbreviation that cannot be read as milliseconds. Code is new: it was missing there too.
#
# Every other key carries the storeTask. prefix. Host bundles are searched before this
# one when a key is resolved, and a plain {Date} or {Comments} of the host would
# silently override ours.
#
# ASCII with \uXXXX escapes, like every other lsFusion bundle here.

