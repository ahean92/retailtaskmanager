# Captions of the subsystem, referenced from .lsf as {Key}.
#
# The artifact used to free-ride on the host bundle: every key here also exists in
# MyCompanyResourceBundle, so a mycompany host resolved them and nothing looked
# wrong. Any other host rendered the raw {Key} instead - lsfusion-erp supplies only
# ID. {Name} alone is used 22 times, so the whole subsystem read as untranslated.
#
# Values are copied verbatim from the mycompany bundle, so a host that carries both
# keeps the captions it already had. Code is new: it was missing there too.
#
# ASCII with \uXXXX escapes, like every other lsFusion bundle here.

Active=Active
Code=Code
ID=ID
In=In
Index=Index
Name=Name
ago=Ago
day_fl=d
hour_fl=h
minute_fl=m
month_fl=mn
second_fl=s
year_fl=y
