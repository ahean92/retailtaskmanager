include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Палитра — геттеры над живым брендом (ui/theme.dart: Wms.* читают
    # ValueNotifier<Brand>), а не константы: заказчик присылает цвета после сборки,
    # и тема переключается на месте (#36917). Правило толкало бы делать const
    # виджеты с цветами внутри — такое поддерево замораживает сегодняшние цвета и
    # не перекрашивается при смене темы (тот самый баг «тема не доходит до
    # открытых экранов»). Поэтому выключено: const ставится руками там, где
    # цветов нет.
    prefer_const_constructors: false
    avoid_print: false
