name: pulse_tasks
description: "Пульс — мобильный клиент задач для магазинов (offline-first MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  # 3.5 — нижняя граница geolocator 14 (соответствует Flutter 3.24)
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # HMAC-SHA256 — из него собран PBKDF2 в data/password_hash.dart: пароль для
  # офлайн-входа сверяется с локальным хэшем (соль + медленная функция)
  crypto: ^3.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # Keychain (iOS) / Keystore (Android) — секреты сессии: токен, учётные данные,
  # хэш пароля. Адрес сервера и кэш оформления остаются в shared_preferences.
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.0.0
  # Геолокация: гейт на входе (без координат внутрь не пускаем). Отсюда же
  # getLastKnownPosition() — послабление для морозильной камеры — и openAppSettings().
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  # Новости и регламент редактируются на сервере в WYSIWYG (RICHTEXT) и приезжают HTML.
  # _core — без webview и без сетевых картинок: рендер идёт обычными виджетами.
  flutter_widget_from_html_core: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test/ — то, что мокается в unit-тестах, проверяется на живом устройстве:
  # реальный Keystore/Keychain и переезд из shared_preferences
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
