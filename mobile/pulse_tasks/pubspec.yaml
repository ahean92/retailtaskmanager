name: pulse_tasks
description: "Пульс — мобильный клиент задач для магазинов (offline-first MVP)."
publish_to: 'none'
version: 0.1.0+1

environment:
  # 3.7 — нижняя граница mobile_scanner 7 (соответствует Flutter 3.29);
  # до него планку держал geolocator 14 (3.5 / Flutter 3.24)
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # HMAC-SHA256 — из него собран PBKDF2 в data/password_hash.dart: пароль для
  # офлайн-входа сверяется с локальным хэшем (соль + медленная функция)
  crypto: ^3.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # Keychain (iOS) / Keystore (Android) — секреты сессии: токен, учётные данные,
  # хэш пароля. Адрес сервера и кэш оформления остаются в shared_preferences.
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.0.0
  # Геолокация: гейт на входе (без координат внутрь не пускаем). Отсюда же
  # getLastKnownPosition() — послабление для морозильной камеры — и openAppSettings().
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  # Своя камера для серийной съёмки (#36914): «витрина целиком, ценник крупно, срок
  # годности» — три кадра подряд, и системный выбиратель image_picker так не умеет
  # (он закрывает камеру после каждого снимка). Здесь превью не гаснет между кадрами,
  # а разрешение задаётся пресетом — сжатие после съёмки не нужно.
  camera: ^0.11.0
  # Скан штрих/QR-кодов камерой для полей типа «Скан кода» (ui/scan_screen.dart).
  # Модель ML Kit по умолчанию в комплекте (bundled) — офлайн-first, подсобка
  # без сети должна сканировать так же, как торговый зал.
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.4
  # Новости и регламент редактируются на сервере в WYSIWYG (RICHTEXT) и приезжают HTML.
  # _core — без webview и без сетевых картинок: рендер идёт обычными виджетами.
  flutter_widget_from_html_core: ^0.15.0
  # Запуск внешних приложений по шаблону URI (#36840) и ссылка на маркет из диалога
  # «не установлено». Запуск по имени пакета идёт НЕ отсюда, а своим каналом в
  # MainActivity (getLaunchIntentForPackage): android_intent_plus для этого непригоден —
  # его canResolveActivity/launch резолвят с MATCH_DEFAULT_ONLY, а launch при
  # не-резолве молча снимает package и открывает системный лаунчер.
  url_launcher: ^6.3.0
  # Пуш (#36720) — единственный способ достучаться до закрытого приложения. Локальные
  # уведомления с фоновым опросом промежуточным вариантом не являются: на Android их
  # душит оптимизация батареи, на iOS они не работают вовсе.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # Версия сборки в реестре устройств — из самой сборки, а не константой в коде:
  # поле нужно для разбора «почему на этом телефоне не работает», и соврать оно не
  # должно ни разу. Захардкоженная строка разъезжается с pubspec на первом же релизе.
  # Планка 9.x, а не 10.x, — не осторожность: с 10.1 пакет требует win32 ^6, а
  # flutter_secure_storage 9.2.4 (Keychain/Keystore для сессии) держится за win32 ^5,
  # и вместе они не разрешаются. Поднимать можно будет вместе с flutter_secure_storage.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Настоящий sqlite в юнит-тестах (#36716): очереди создания и барьер порядка
  # синхронизации живут в схеме, и мокать их — значит не проверить ничего.
  sqflite_common_ffi: ^2.3.0
  # integration_test/ — то, что мокается в unit-тестах, проверяется на живом устройстве:
  # реальный Keystore/Keychain и переезд из shared_preferences
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
